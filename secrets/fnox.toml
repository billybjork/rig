# fnox's global config (~/.config/fnox/config.toml links here): where every
# project's secrets live. A project's fnox.toml names its secrets and their
# keys in these providers, never values (rig README, "Secrets").
#
# Bitwarden Secrets Manager holds the values: project `dev` for local work,
# `deploy` for prod-facing and unattended commands. Each is read with its own
# machine account's token, which fnox takes from the login Keychain and keeps
# out of the command's environment (env = false).
#
#   fnox exec -- <command>                        dev secrets (laptop token)
#   fnox -P deploy exec --no-defaults -- <cmd>    deploy secrets only (shipyard token)

[providers.token]
type = "keychain"
service = "rig-bws-laptop"

[providers.dev]
type = "bitwarden-sm"
project_id = "1bd860ad-78f1-4d12-86db-b4f101295e41"

[providers.deploy]
type = "bitwarden-sm"
project_id = "136e3f4d-4c20-4958-bed5-b4f101297a8e"

[secrets]
FNOX_BWS_ACCESS_TOKEN = { provider = "token", value = "billy", env = false }

[profiles.deploy.providers.token]
type = "keychain"
service = "rig-bws-shipyard"

[profiles.deploy.secrets]
FNOX_BWS_ACCESS_TOKEN = { provider = "token", value = "billy", env = false }
